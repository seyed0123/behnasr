
services:
  db:
    image: postgres:bullseye
    environment:
      POSTGRES_DB: api_website
      POSTGRES_USER: seyed
      POSTGRES_PASSWORD: qwe!@#poi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    image: seyed0123/webapiserver:v2
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             echo \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='seyed').exists() or User.objects.create_superuser('seyed', 'seyed123ali123@gmail.com', '!@#qweasdzxc')\" | python manage.py shell &&
             gunicorn --bind 0.0.0.0:8000 apiwebsite.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
    expose:
      - 8000

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
