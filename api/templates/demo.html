{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}
    {% trans 'Demo' %}
{% endblock %}
{% block content %}
    <div class="container my-5 p-3 bg-body-secondary shadow">
            <h2 class="text-center">Test the {{ api_method.title }} Api</h2>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form id="uploadForm">
                        <div class="mb-3">
                            <label for="imageUpload" class="form-label">Select an Image</label>
                            <input class="form-control" type="file" id="imageUpload" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Upload</button>
                    </form>
                </div>
            </div>
            <div class="row justify-content-center mt-4">
                <div id="result" class="col-md-6 text-center">
                    <!-- Processed images will be displayed here -->
                </div>
            </div>
        </div>
{% endblock %}
{% block js %}
<script src="{% static 'prism.js' %}"></script>
    <script>
        $(document).ready(function() {
    $('#uploadForm').on('submit', function(event) {
        event.preventDefault();

        const fileInput = $('#imageUpload')[0];
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('image', file);
        formData.append('method', '{{api_method.title}}'); // Include the method parameter

        // Show a Bootstrap spinner during the upload process
        const resultDiv = $('#result');
        resultDiv.html(`
            <div class="d-flex justify-content-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `);

        $.ajax({
            url: 'http://localhost:8000/api/endpoint/',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            xhrFields: {
                responseType: 'blob'
            },
            beforeSend: function(xhr) {
                xhr.setRequestHeader('method', '{{api_method.title  }}');
                xhr.setRequestHeader('Authorization', 'Token {{key}}');
            },
            success: function(blob) {
                resultDiv.empty();
                const processedImg = $('<img>').addClass('img-fluid mt-2').attr('alt', 'Processed Image');
                const processedURL = URL.createObjectURL(blob);
                processedImg.attr('src', processedURL);
                resultDiv.append('<h5>Processed Image:</h5>').append(processedImg);

            },
            error: function(jqXHR, textStatus, errorThrown) {
                console.log(jqXHR, textStatus, errorThrown);

                // Display the error on the page
                const errorMessage = `
                    <p class="text-danger">An error occurred while processing the image:</p>
                    <ul class="text-danger">
                        <li>Status: ${jqXHR.status}</li>
                        <li>Status Text: ${jqXHR.statusText}</li>
                        <li>Error Thrown: ${errorThrown}</li>
                        <li>Response Text: ${jqXHR.responseText}</li>
                    </ul>
                `;
                resultDiv.html(errorMessage);
            }
        });
    });
});

    </script>
{% endblock %}
